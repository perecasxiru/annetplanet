<body style="text-align: center; " onload="loadInit()">
<br>
<div class="container" id="main-container">
    <div class="row">
        <div class="col-lg-2 col-12">
            <img src='images/logo.png' class="img-fluid">
            <h4 style="font-family: 'Annet Planet',serif">ANNET PLANET</h4>
            <br>

            <!--     LINKS       -->
            <a href="#">comics</a><br>
            <a href="#">archive</a><br>
            <a href="about">about</a><br>

            <br>

            <!--     FOOTER       -->
            <div style="font-size:0.8em">annetplanetcomics@gmail.com</div>
            <div style="line-height:50%;"><br></div>
            <div class="a2a_kit a2a_kit_size_32 a2a_default_style a2a_follow row justify-content-center">
                <script async src="https://static.addtoany.com/menu/page.js"></script>
                <a class="a2a_button_facebook" data-a2a-follow="annetplanetcomics"></a>
                <a class="a2a_button_instagram" data-a2a-follow="annetplanetcomics"></a>
            </div>

        </div>
        <div class="col-lg-10 col-12">
            <div class="row justify-content-center">
                <p>
                    <button id="first" type="button" style="font-family: 'Annet Planet',serif"
                            class="btn btn-outline-info annetfont" onclick="loadFirst()">
                        first
                    </button>

                    <button id="prev" type="button" style="font-family: 'Annet Planet',serif"
                            class="btn btn-outline-info annetfont" onclick="Previous()">
                        previous
                    </button>

                    <button id="rand" type="button" style="font-family: 'Annet Planet',serif"
                            class="btn btn-outline-info annetfont" onclick="loadRandom()">
                        random
                    </button>

                    <button id="next" type="button" style="font-family: 'Annet Planet',serif"
                            class="btn btn-outline-info annetfont" onclick="Next()">
                        next
                    </button>

                    <button id="last" type="button" style="font-family: 'Annet Planet',serif"
                            class="btn btn-outline-info annetfont" onclick="loadLast()">
                        last
                    </button>

                </p>
            </div>

            <img src="" id="displayComic" class="img-fluid customImage" onclick="Next()">

        </div>
    </div>
</div>
