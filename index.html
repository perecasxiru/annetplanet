    <style>
       /*Up-left pointing*/
        .triangle-up-left {
            width: 0;
            height: 0;
            padding-bottom: 10%;
            padding-left: 10%;
            overflow: hidden;
            float: left;
        }
        .triangle-up-left:after {
            content: "";
            display: block;
            width: 0;
            height: 0;
            margin-left: -500px;
            border-bottom: 500px solid transparent;
            border-left: 500px solid #4679BD;
        }

        /*Up-right pointing*/
        .triangle-up-right {
            width: 0;
            height: 0;
            padding-left:10%;
            padding-top: 10%;
            overflow: hidden;
            float: right;
        }
        .triangle-up-right:after {
            content: "";
            display: block;
            width: 0;
            height: 0;
            margin-left:-500px;
            margin-top:-500px;
            border-left: 500px solid transparent;
            border-top: 500px solid #4679BD;
        }

        h1{
            font-size: 3em;
        }

        @media only screen and (min-width: 600px) {
            .customImage {
                width: 50%;
            }
        }
    </style>
    <script>

    var im_act = 0;
    var im_names='{{ names }}'.split(" ");

    function loadRandom() {
        var rand;
        do{
            rand = Math.floor(Math.random() * 37)+1;
        }
        while (rand===im_act);

        im_act = rand;
        var selected = "COMIC"+ im_act.toString()+".jpg";
        document.getElementById("displayComic").src = 'comics/'+selected;
        window.history.replaceState({},'annetplanet.herokuapp.com','COMIC37'.toString());
    }

    function loadLast() {
        im_act = 37;
        var selected = "COMIC"+ (im_act).toString()+".jpg";
        document.getElementById("displayComic").src = 'comics/'+ selected;
        window.history.replaceState({},'annetplanet.com','COMIC37');
    }

    function loadInit() {

        im_act = 37;
        var selected = "COMIC"+ (im_act).toString()+".jpg";
        document.getElementById("displayComic").src = 'comics/'+ selected;
        window.history.replaceState({},'annetplanet.herokuapp.com','COMIC37'.toString());
    }

    function loadFirst() {
        im_act = 1;
        document.getElementById("displayComic").src = 'comics/'+"COMIC1.jpg";
        window.history.replaceState({},'annetplanet.herokuapp.com','COMIC37'.toString());
    }

    function Next() {
        im_act++;
        if(im_act>37){
            im_act=37;
        }
        var selected = "COMIC"+ (im_act).toString()+".jpg";
        document.getElementById("displayComic").src = 'comics/'+ selected;
        window.history.replaceState({},'annetplanet.herokuapp.com','COMIC37'.toString());
    }

    function Previous() {
        im_act--;
        if(im_act<1){
            im_act=1;
        }
        var selected = "COMIC"+ (im_act).toString()+".jpg";
        document.getElementById("displayComic").src = 'comics/'+ selected;
        window.history.replaceState({},'annetplanet.herokuapp.com','COMIC37'.toString());
    }

    </script>

      <button type="button" class="btn btn-outline-info btn-lg" onclick="loadFirst()">First</button>
      <button type="button" class="btn btn-outline-info btn-lg" onclick="Previous()">Previous</button>
      <button type="button" class="btn btn-outline-info btn-lg" onclick="loadRandom()">Random</button>
      <button type="button" class="btn btn-outline-info btn-lg" onclick="Next()">Next</button>
      <button type="button" class="btn btn-outline-info btn-lg" onclick="loadLast()">Last</button>
